name: frontend-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node GENERAL_HARNESS/scripts/validate-project-adapter.mjs --project-root . --require-adapter --strict --json
      - run: node GENERAL_HARNESS/scripts/validate-no-secrets.mjs
      - run: node GENERAL_HARNESS/scripts/validate-work-records.mjs --project-root . --reports reports --strict --json
